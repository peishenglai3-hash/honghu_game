server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/honghu/current;
    index index.html;

    # 压缩 JS/CSS/JSON 等文本资源，降低首屏传输量。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # 首页必须始终重新确认当前版本；哈希资源负责长期缓存。
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 静态资源缺失时明确返回 404，不能把 index.html 当成脚本或样式返回。
    location ~* ^/assets/index-[A-Za-z0-9_-]+\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 视频和音频保留 Range 能力，便于移动浏览器分段读取并支持断点播放。
    location ~* \.(mp4|mp3|ogg|wav)$ {
        try_files $uri =404;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
